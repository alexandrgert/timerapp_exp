name: Android preview

on:
  workflow_dispatch:
  push:
    branches:
      - build/approved-preview-20260926-03

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        run: |
          set -o pipefail
          {
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdk_manager" ]]; then
              echo '::error::The ubuntu-24.04 runner has no usable preinstalled sdkmanager.'
              exit 1
            fi
            echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
            echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
            echo "$sdk_root/emulator" >> "$GITHUB_PATH"
            java -version
            "$sdk_manager" --version
            # Hosted images already contain accepted licenses. Install only required packages.
            "$sdk_manager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          } 2>&1 | tee preview-sdk-setup.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests and preview APK
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee preview-build.log
      - name: Android UI tests
        run: |
          set -o pipefail
          bash scripts/run-preview-ui-tests.sh 2>&1 | tee preview-ui-tests.log
      - name: Record exact APK size and checksum
        id: apk
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from decimal import Decimal
          from pathlib import Path
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          size = apk.stat().st_size
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          baseline = 59820732
          delta = size - baseline
          percent = Decimal(delta) * 100 / Decimal(baseline)
          previous_vosk = 101063213
          delta_from_vosk = size - previous_vosk
          percent_from_vosk = Decimal(delta_from_vosk) * 100 / Decimal(previous_vosk)
          model_archive = 60239942
          model_expanded = 74004174
          metrics = {
              'commit': os.environ['GITHUB_SHA'],
              'variant': 'debug',
              'application_id': 'com.timerapp.exp.preview',
              'apk_bytes': size,
              'apk_sha256': checksum,
              'baseline_apk_bytes': baseline,
              'baseline_commit': 'b90dbdd',
              'baseline_run_id': 36236814073,
              'delta_bytes': delta,
              'delta_percent': format(percent, '.2f'),
              'previous_vosk_apk_bytes': previous_vosk,
              'previous_vosk_commit': '65cc580',
              'previous_vosk_run_id': 36238546667,
              'delta_from_vosk_bytes': delta_from_vosk,
              'delta_from_vosk_percent': format(percent_from_vosk, '.2f'),
              'voice_engine': 'sherpa-onnx',
              'voice_engine_in_apk': True,
              'model_in_apk': False,
              'model_name': 'sherpa-onnx-zipformer-ru-int8-2025-04-20',
              'model_download_bytes': model_archive,
              'model_expanded_content_bytes': model_expanded,
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write(f'bytes={size}\n')
          report = (
              '# TaskTimer Preview\n\n'
              f'Commit: `{os.environ["GITHUB_SHA"]}`\n\n'
              'Application ID: `com.timerapp.exp.preview`\n\n'
              f'APK: **{size:,} bytes** ({size / 1024 / 1024:.2f} MiB)\n\n'
              f'SHA-256: `{checksum}`\n\n'
              f'Baseline debug APK: **{baseline:,} bytes**, commit `b90dbdd`, '
              '[GitHub run 36236814073](https://github.com/alexandrgert/timerapp_exp/actions/runs/36236814073).\n\n'
              f'Change from baseline: **{delta:+,} bytes ({percent:+.2f}%)**.\n\n'
              'The change includes all features since the baseline, not only the speech engine.\n\n'
              f'Previous Vosk debug APK: **{previous_vosk:,} bytes**, commit `65cc580`, '
              '[GitHub run 36238546667](https://github.com/alexandrgert/timerapp_exp/actions/runs/36238546667).\n\n'
              f'Change from Vosk APK: **{delta_from_vosk:+,} bytes ({percent_from_vosk:+.2f}%)**.\n\n'
              'This comparison includes all changes since the Vosk build; it is not an isolated engine measurement.\n\n'
              'sherpa-onnx speech engine: included in APK. Zipformer RU INT8 model: downloaded separately, not bundled.\n\n'
              f'Model download: **{model_archive:,} bytes** ({model_archive / 1024 / 1024:.2f} MiB).\n\n'
              f'Expanded archive content: **{model_expanded:,} bytes** ({model_expanded / 1024 / 1024:.2f} MiB), '
              'excluding the 64-byte install marker and filesystem overhead.\n\n'
              'APK size is the distribution-file size, not total installed Android storage.\n'

          )
          (apk.parent / 'size-and-sha256.md').write_text(report)
          (apk.parent / 'size-comparison.json').write_text(json.dumps(metrics, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report)
          PY
      - name: Upload verified preview
        uses: actions/upload-artifact@v5
        with:
          name: tasktimer-preview-${{ steps.apk.outputs.bytes }}-bytes
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/size-and-sha256.md
            android/app/build/outputs/apk/debug/size-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Annotate bounded test and compiler failures
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          messages = []
          for directory in ('app/build/test-results', 'app/build/outputs/androidTest-results'):
              for report in sorted(Path(directory).rglob('*.xml'))[:100]:
                  try:
                      root = ET.parse(report).getroot()
                  except (ET.ParseError, OSError):
                      continue
                  for case in root.iter('testcase'):
                      for problem in (*case.findall('failure'), *case.findall('error')):
                          detail = problem.get('message') or (problem.text or '')
                          messages.append(f"{case.get('classname', '')}.{case.get('name', '')}: {detail[:1200]}")
                          if len(messages) >= 10:
                              break
                      if len(messages) >= 10:
                          break
                  if len(messages) >= 10:
                      break
              if len(messages) >= 10:
                  break
          if len(messages) < 10:
              pattern = re.compile(r'^(e: |[Ee]rror[: ]|.*\.kt:\d+|Execution failed for task|FAILURE:|.* FAILED$|.*[Ee]xception[: ])')
              for name in ('preview-sdk-setup.log', 'preview-ui-tests.log', 'preview-build.log'):
                  if name == 'preview-sdk-setup.log' and Path('preview-build.log').exists():
                      continue
                  log = Path(name)
                  if not log.is_file():
                      continue
                  # Only a bounded tail of ordinary debug Gradle output is inspected.
                  with log.open('rb') as stream:
                      stream.seek(max(0, log.stat().st_size - 65536))
                      lines = stream.read(65536).decode('utf-8', errors='replace').splitlines()
                  if name == 'preview-sdk-setup.log' and not Path('preview-build.log').exists():
                      messages.extend(line[:1200] for line in lines if line.strip())
                      messages = messages[-10:]
                      break
                  for line in lines:
                      if pattern.search(line):
                          messages.append(line[:1200])
                          if len(messages) >= 10:
                              break
                  if len(messages) >= 10:
                      break
          if not messages:
              if Path('preview-build.log').exists() and not Path('preview-ui-tests.log').exists():
                  messages.append('UI test log was not created: the UI command did not start. Inspect the preceding failed step and uploaded reports.')
              else:
                  messages.append('Android preview failed without a recognized test/compiler error; inspect the failed step and uploaded reports.')
          for message in messages[:10]:
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Android preview failure::{escaped}')
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            android/preview-sdk-setup.log
            android/preview-build.log
            android/preview-ui-tests.log
            android/preview-emulator.log
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

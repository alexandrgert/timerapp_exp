name: Self-hosted PWA verification and package

# One approved self-host release. Do not push this branch again without new approval.
on:
  push:
    branches: [release/approved-selfhost-20261112-01]

permissions:
  contents: write

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install browser test dependencies
        working-directory: pwa
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Existing PWA regression tests
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 300s npm test 2>&1 | tee regression-tests.log
      - name: Self-hosted API, storage and browser tests
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 180s node --test --test-concurrency=1 selfhost/tests/*.test.cjs 2>&1 | tee selfhost-tests.log
      - name: Real Service Worker regression
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 120s node tests/live-offline.check.cjs 2>&1 | tee selfhost-sw.log
          timeout --kill-after=10s 90s node selfhost/tests/live-offline.check.cjs 2>&1 | tee selfhost-live.log
      - name: Create source runtime package in GitHub only
        run: |
          set -euo pipefail
          mkdir -p selfhost-package
          git archive --format=tar HEAD pwa/public pwa/server.cjs pwa/selfhost docs/user-guide | gzip > selfhost-package/tasktimer-selfhost.tar.gz
          git rev-parse HEAD > selfhost-package/REVISION
          cd selfhost-package
          sha256sum tasktimer-selfhost.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: tasktimer-selfhost
          path: selfhost-package/
          if-no-files-found: error
      - name: Publish isolated self-host preview release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const tag = 'selfhost-preview-2026.11.12.1';
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: 'TaskTimer PWA Self-host preview — 12 ноября 2026',
              body: await fs.readFile('pwa/selfhost/release-notes-2026-11-12.md', 'utf8'),
              draft: true, prerelease: true, make_latest: 'false'
            });
            for (const name of ['tasktimer-selfhost.tar.gz', 'SHA256SUMS', 'REVISION']) {
              const data = await fs.readFile('selfhost-package/' + name);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name, data,
                headers: {'content-type': name.endsWith('.gz') ? 'application/gzip' : 'text/plain', 'content-length': data.length}
              });
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.data.id,
              draft: false, prerelease: true, make_latest: 'false'});
            core.info('Published ' + release.data.html_url);
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: selfhost-verification-reports
          path: |
            pwa/regression-tests.log
            pwa/selfhost-tests.log
            pwa/selfhost-sw.log
            pwa/selfhost-live.log

name: Desktop Ubuntu compatibility preview

# One approved DEB 0.11.6 build; do not update without new approval.
on:
  push:
    branches: [build/approved-desktop-20260929-03]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Ubuntu 20.04 build environment
        run: |
          docker build --build-arg BUILD_UID="$(id -u)" --build-arg BUILD_GID="$(id -g)" \
            -f packaging/linux/Dockerfile.compat -t tasktimer-focal packaging/linux
      - name: Test source, build DEB and validate ELF dependencies
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/workspace" tasktimer-focal 2>&1 | tee desktop-build.log
      - name: Save test and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-build-diagnostics
          path: desktop-build.log
          if-no-files-found: ignore
      - name: Verify package version and record checksums
        run: |
          test "$(dpkg-deb -f dist/timerapp-exp-0.11.6-amd64.deb Version)" = '0.11.6'
          dpkg-deb -f dist/timerapp-exp-0.11.6-amd64.deb Package Version Architecture Installed-Size > dist/build-info.txt
          stat -c 'DEB bytes: %s' dist/timerapp-exp-0.11.6-amd64.deb >> dist/build-info.txt
          cd dist
          sha256sum timerapp-exp-0.11.6-amd64.deb > SHA256SUMS
          cat build-info.txt SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-ubuntu-preview
          path: |
            dist/timerapp-exp-*-amd64.deb
            dist/build-info.txt
            dist/SHA256SUMS
          if-no-files-found: error

  startup:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '22.04', '24.04', '26.04']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: desktop-ubuntu-preview
          path: dist
      - name: Install DEB and open real main window as an unprivileged fresh user
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace "ubuntu:$UBUNTU_VERSION" \
            bash -c 'bash packaging/linux/smoke_installed.sh dist/timerapp-exp-*-amd64.deb'

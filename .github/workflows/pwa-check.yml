name: PWA verification only

# One user-approved PWA-only verification. Do not push this branch again without new approval.
on:
  push:
    branches: [check/approved-pwa-20261001-01]

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install PWA test dependencies and ready Chromium
        id: dependencies
        working-directory: pwa
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: PWA unit and browser tests (serial)
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 240s node --test --test-concurrency=1 --test-timeout=30000 tests/*.test.mjs tests/*.test.cjs 2>&1 | tee pwa-tests.log
      - name: Real Service Worker offline reload and accepted update
        if: ${{ always() && !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 120s node tests/live-offline.check.cjs 2>&1 | tee live-offline-tests.log
      - name: Download and verify Russian model fixture
        id: voice_fixture
        if: ${{ always() && !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 300s node --input-type=module <<'JS' 2>&1 | tee voice-fixture.log
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {VOICE_FILES} from './public/voice-assets.mjs';
          const folder=path.join(process.env.RUNNER_TEMP,'tasktimer-voice-fixture');
          await fs.mkdir(folder,{recursive:true});
          const base='https://huggingface.co/csukuangfj/sherpa-onnx-zipformer-ru-int8-2025-04-20/resolve/641de8d322c05b9087ad2927ccda4bda3cccc159/';
          const files=[...VOICE_FILES.filter(file=>!file.runtime),{name:'test_wavs-0.wav',url:base+'test_wavs/0.wav',size:295758,sha256:'f3ac4f6e5b818ec89bdd884f60637daa32ef0ed19a11981b7e02e3e7799dfd79'}];
          for(const file of files){
            const response=await fetch(file.url,{signal:AbortSignal.timeout(120000)});
            if(!response.ok)throw new Error(`Fixture HTTP ${response.status}`);
            const bytes=Buffer.from(await response.arrayBuffer());
            if(bytes.length!==file.size || crypto.createHash('sha256').update(bytes).digest('hex')!==file.sha256)throw new Error(`Fixture integrity: ${file.name}`);
            await fs.writeFile(path.join(folder,file.name),bytes);
          }
          JS
      - name: Real WASM worker inference (routed browser origin, not production HTTPS)
        if: ${{ always() && !cancelled() && steps.voice_fixture.outcome == 'success' }}
        working-directory: pwa
        run: |
          set -o pipefail
          timeout --kill-after=10s 200s node tests/voice-inference.check.cjs "$RUNNER_TEMP/tasktimer-voice-fixture" 2>&1 | tee voice-inference.log
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pwa-verification-reports
          path: |
            pwa/pwa-tests.log
            pwa/live-offline-tests.log
            pwa/live-offline-report.json
            pwa/voice-fixture.log
            pwa/voice-inference.log
          if-no-files-found: ignore

name: Recover Android and release 0.11.8

# One explicitly approved manual run; desktop packages are never rebuilt here.
on:
  push:
    branches: [release/approved-android-recovery-20261001-01]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-android-recovery-0.11.8
  cancel-in-progress: false

env:
  DESKTOP_RUN: '36859044412'
  DESKTOP_SHA: 29db6bff343e39526b43d16627aeb3879909b648

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject any unrelated source or version change
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          base = os.environ['DESKTOP_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          source = 'android/app/src/main/java/com/timerapp/linkb24/sync/SyncV2Store.kt'
          allowed = {source, '.github/workflows/release-android-recovery.yml', 'docs/release-recovery-v0.11.8.md'}
          assert changed <= allowed and source in changed, f'Unexpected recovery changes: {sorted(changed)}'
          before = subprocess.check_output(['git', 'show', f'{base}:{source}'], text=True)
          needle = '        return commit(state)\n'
          assert before.count(needle) == 1
          assert Path(source).read_text() == before.replace(needle, '        commit(state)\n'), 'Android change is not the approved one-line fix'
          PYCODE
          python3 scripts/check_version_sync.py
      - name: Verify exact prior run, desktop gates and immutable artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = Number(process.env.DESKTOP_RUN);
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.head_sha !== process.env.DESKTOP_SHA || run.status !== 'completed' || run.run_attempt !== 1 || run.path !== '.github/workflows/full-release.yml') throw new Error('Unexpected desktop source run');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id, filter: 'latest', per_page: 100});
            for (const name of ['test', 'build-deb', 'build-exe', 'build-macos', 'verify-deb (20.04)', 'verify-deb (22.04)', 'verify-deb (24.04)', 'verify-deb (26.04)']) {
              const matches = jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].conclusion !== 'success') throw new Error(`Desktop gate failed: ${name}`);
            }
            const expected = [
              ['linux-packages', 11161282319, 'b55563bdb308836326ca8d33ad453cadcb241ac531d7541a7c7b729bf90ae782'],
              ['exe-win64', 11161865156, '7472ff826ed902e18f53b8e3610a603d8a9de535952bdb7899d369dc02d88ea0'],
              ['macos-zip', 11160926425, '7577d1121ed09798b09671174d61a2e7152b278e033ddb29c206aa2e1f6505eb'],
            ];
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id, per_page: 100});
            for (const [name, id, digest] of expected) {
              const matches = artifacts.filter(item => item.name === name);
              if (matches.length !== 1 || matches[0].id !== id || matches[0].expired || matches[0].digest !== `sha256:${digest}`) throw new Error(`Desktop artifact mismatch: ${name}`);
            }
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag: 'v0.11.8'});
              throw new Error('Release already exists; manual review required');
            } catch (error) { if (error.status !== 404) throw error; }

  build-apk:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android version matches pyproject.toml
        run: python scripts/check_version_sync.py

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)." >&2
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/tasktimer-release.jks
          python3 scripts/write_android_keystore_from_env.py

      - name: Build Android APK
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh
          cd android
          bash ./gradlew --no-daemon :app:testReleaseUnitTest
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > release-package-info.txt
          python3 - <<'PY'
          from pathlib import Path
          line = Path("release-package-info.txt").read_text()
          assert "name='com.timerapp.exp'" in line
          assert "versionCode='1108'" in line
          assert "versionName='0.11.8'" in line
          PY

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-test-results
          path: android/app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: apk-android
          path: dist/timerapp-exp-*-android.apk
          if-no-files-found: error

  publish:
    needs: [preflight, build-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify pinned desktop archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, subprocess, zipfile
          from pathlib import Path
          archives = [
              ('linux-packages', 11161282319, 'b55563bdb308836326ca8d33ad453cadcb241ac531d7541a7c7b729bf90ae782'),
              ('exe-win64', 11161865156, '7472ff826ed902e18f53b8e3610a603d8a9de535952bdb7899d369dc02d88ea0'),
              ('macos-zip', 11160926425, '7577d1121ed09798b09671174d61a2e7152b278e033ddb29c206aa2e1f6505eb'),
          ]
          destination = Path('release-assets'); destination.mkdir()
          archive_dir = Path(os.environ['RUNNER_TEMP']) / 'desktop-recovery'; archive_dir.mkdir()
          provenance = []
          for name, artifact_id, digest in archives:
              api = f'repos/{os.environ["GH_REPO"]}/actions/artifacts/{artifact_id}'
              metadata = json.loads(subprocess.check_output(['gh', 'api', api]))
              assert metadata['name'] == name and not metadata['expired']
              assert metadata['workflow_run']['id'] == int(os.environ['DESKTOP_RUN'])
              assert metadata['workflow_run']['head_sha'] == os.environ['DESKTOP_SHA']
              assert metadata['digest'] == 'sha256:' + digest
              archive = archive_dir / (name + '.zip')
              with archive.open('wb') as output:
                  subprocess.run(['gh', 'api', api + '/zip'], stdout=output, check=True)
              with archive.open('rb') as source:
                  assert hashlib.file_digest(source, 'sha256').hexdigest() == digest, f'Archive checksum mismatch: {name}'
              with zipfile.ZipFile(archive) as bundle:
                  for item in bundle.infolist():
                      assert not item.is_dir() and '/' not in item.filename and '\\' not in item.filename
                      assert item.filename.startswith('timerapp-exp-0.11.8') and item.filename != 'timerapp-exp-0.11.8-android.apk'
                      assert (item.external_attr >> 16) & 0o170000 != 0o120000, 'Symlink rejected'
                      with bundle.open(item) as source, (destination / item.filename).open('xb') as output:
                          shutil.copyfileobj(source, output)
              provenance.append(f'Desktop archive {name}: artifact {artifact_id}, sha256:{digest}\n')
          Path('desktop-provenance.txt').write_text(''.join(provenance))
          PYCODE
      - uses: actions/download-artifact@v5
        with:
          name: apk-android
          path: release-assets
      - name: Verify complete matrix and record separate build provenance
        run: |
          python3 scripts/prepare_release_assets.py release-assets
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          with Path('release-assets/build-info.txt').open('a') as output:
              output.write('\nRecovery release: desktop packages reused unchanged; only Android rebuilt.\n')
              output.write(f'Desktop commit: {os.environ["DESKTOP_SHA"]}\n')
              output.write(f'Desktop build: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["DESKTOP_RUN"]}\n')
              output.write(f'Android commit: {os.environ["GITHUB_SHA"]}\n')
              output.write(f'Android build: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n')
              output.write(Path('desktop-provenance.txt').read_text())
          PYCODE
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.11.8 --target "$GITHUB_SHA" \
            --title 'TaskTimer Experiment 0.11.8' \
            --notes-file docs/release-notes-v0.11.8.md --draft \
            release-assets/*
          gh release edit v0.11.8 --draft=false --latest

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Qt / PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 libx11-6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 libx11-6

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build amd64 .deb
        run: |
          python -m venv .venv
          export VERSION="$PACKAGE_VERSION"
          ALLOW_NO_BUMP=1 NO_BUMP=1 ./build_deb.sh

      - name: Install Linux extra packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ruby ruby-dev build-essential rpm curl ca-certificates file \
            flatpak flatpak-builder ostree squashfs-tools zip unzip snapd
          sudo gem install fpm --no-document
          sudo systemctl enable --now snapd.socket || true
          sudo systemctl start snapd || true
          sudo snap wait system seed.loaded || true
          # Snap Store can time out on GHA; retry then fall back to offline snap download.
          snapcraft_ok=0
          for attempt in 1 2 3 4 5; do
            if sudo snap install snapcraft --classic; then
              snapcraft_ok=1
              break
            fi
            echo "snapcraft install attempt ${attempt} failed; retrying..." >&2
            sleep $((attempt * 10))
          done
          if [[ "$snapcraft_ok" -ne 1 ]]; then
            tmp="$(mktemp -d)"
            (
              cd "$tmp"
              for attempt in 1 2 3; do
                snap download snapcraft --basename snapcraft && break
                sleep $((attempt * 10))
              done
              sudo snap ack snapcraft.assert
              sudo snap install snapcraft.snap --classic
            )
            rm -rf "$tmp"
          fi
          command -v snapcraft
          mkdir -p "$HOME/linuxdeploy"
          curl -fL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$HOME/linuxdeploy/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/linuxdeploy/appimagetool-x86_64.AppImage"
          echo "APPIMAGETOOL=$HOME/linuxdeploy/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build Linux extras (full matrix)
        run: ./build_linux_extra.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/timerapp-exp-*-amd64.deb
            dist/timerapp-exp-*-amd64.rpm
            dist/timerapp-exp-*-linux-amd64.tar.xz
            dist/timerapp-exp-*-linux-amd64.tgz
            dist/timerapp-exp-*-x86_64.AppImage
            dist/timerapp-exp-*-x86_64.flatpak
            dist/timerapp-exp-*-amd64.snap
            dist/timerapp-exp-*.ebuild
            dist/timerapp-exp-*-gentoo-overlay.tar.xz
            dist/timerapp-exp-*-x86_64.pisi
            dist/timerapp-exp-*-amd64.pet
            dist/timerapp-exp-*-amd64.pup
            dist/timerapp-exp-*-amd64.lzm
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build win64 .exe
        shell: pwsh
        run: |
          python -m venv .venv
          $env:VERSION = $env:PACKAGE_VERSION
          $env:NO_BUMP = "1"
          .\build_exe.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: exe-win64
          path: dist/timerapp-exp-*-win64.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build macOS .app zip
        run: |
          python3 -m venv .venv
          export VERSION="$PACKAGE_VERSION"
          export NO_BUMP=1
          ./build_macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos-zip
          path: dist/timerapp-exp-*-macos-*.zip
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Verify Android version matches pyproject.toml
        run: python scripts/check_version_sync.py

      - name: Build Android APK
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - uses: actions/upload-artifact@v5
        with:
          name: apk-android
          path: dist/timerapp-exp-*-android.apk
          if-no-files-found: error

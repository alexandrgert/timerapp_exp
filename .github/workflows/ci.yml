name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Qt / PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 libx11-6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 libx11-6

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build amd64 .deb
        run: |
          python -m venv .venv
          export VERSION="$PACKAGE_VERSION"
          ALLOW_NO_BUMP=1 NO_BUMP=1 ./build_deb.sh

      - name: Install Linux extra packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ruby ruby-dev build-essential rpm curl ca-certificates file \
            flatpak flatpak-builder librsvg2-common ostree squashfs-tools zip unzip snapd
          sudo gem install fpm --no-document
          mkdir -p "$HOME/linuxdeploy"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          # Bump APPIMAGETOOL_SHA256 when intentionally updating the pinned release.
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fL "$APPIMAGETOOL_URL" -o "$HOME/linuxdeploy/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $HOME/linuxdeploy/appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x "$HOME/linuxdeploy/appimagetool-x86_64.AppImage"
          echo "APPIMAGETOOL=$HOME/linuxdeploy/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build Linux extras (full matrix)
        run: ./build_linux_extra.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/timerapp-exp-*-amd64.deb
            dist/timerapp-exp-*-amd64.rpm
            dist/timerapp-exp-*-linux-amd64.tar.xz
            dist/timerapp-exp-*-linux-amd64.tgz
            dist/timerapp-exp-*-x86_64.AppImage
            dist/timerapp-exp-*-x86_64.flatpak
            dist/timerapp-exp-*-amd64.snap
            dist/timerapp-exp-*.ebuild
            dist/timerapp-exp-*-gentoo-overlay.tar.xz
            dist/timerapp-exp-*-x86_64.pisi
            dist/timerapp-exp-*-amd64.pet
            dist/timerapp-exp-*-amd64.pup
            dist/timerapp-exp-*-amd64.lzm
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build win64 .exe
        shell: pwsh
        run: |
          python -m venv .venv
          $env:VERSION = $env:PACKAGE_VERSION
          $env:NO_BUMP = "1"
          .\build_exe.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: exe-win64
          path: dist/timerapp-exp-*-win64.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Read package version
        run: |
          echo "PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"

      - name: Build macOS .app zip
        run: |
          python3 -m venv .venv
          export VERSION="$PACKAGE_VERSION"
          export NO_BUMP=1
          ./build_macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos-zip
          path: dist/timerapp-exp-*-macos-*.zip
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Verify Android version matches pyproject.toml
        run: python scripts/check_version_sync.py

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)." >&2
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/tasktimer-release.jks
          python3 scripts/write_android_keystore_from_env.py

      - name: Build Android APK
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - uses: actions/upload-artifact@v5
        with:
          name: apk-android
          path: dist/timerapp-exp-*-android.apk
          if-no-files-found: error

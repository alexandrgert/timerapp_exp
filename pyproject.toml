[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timerapp-ag"
version = "0.11.5"
description = "Десктопный таймер задач с интеграцией Битрикс24"
requires-python = ">=3.10"
dependencies = [
    # Linux 6.10+ wheels require glibc >= 2.34; Ubuntu 20.04 has 2.31.
    "PySide6==6.9.3; sys_platform == 'linux'",
    "PySide6==6.11.0; sys_platform != 'linux'",
    "fast-bitrix24>=1.8",
    "python-dotenv>=1.0",
]

[project.scripts]
timerapp = "timerapp_ag.main:main"

[tool.setuptools.package-data]
timerapp_ag = ["assets/fonts/*.ttf"]

[tool.setuptools.packages.find]
where = ["src"]
